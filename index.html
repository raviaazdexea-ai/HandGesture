<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electric Pulse Oval</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; cursor: none; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let mouse = { x: 0, y: 0 };
        const stars = [];
        const numStars = 800; 

        // Posisi bola energi
        let ballPos = { x: 0, y: 0 };
        
        function init() {
            resize();
            ballPos = { x: width / 2, y: height / 2 };
            for (let i = 0; i < numStars; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 2,
                    brightness: Math.random()
                });
            }
        }

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        function draw() {
            // Background hitam pekat
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, width, height);

            // Pergerakan smooth mengikuti mouse
            ballPos.x += (mouse.x - ballPos.x) * 0.15;
            ballPos.y += (mouse.y - ballPos.y) * 0.15;

            // Gambar Bintang
            stars.forEach(star => {
                ctx.fillStyle = `rgba(255, 255, 255, ${star.brightness})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();

                // Sambaran Listrik ke Bintang terdekat
                const dx = ballPos.x - star.x;
                const dy = ballPos.y - star.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < 120) {
                    ctx.beginPath();
                    ctx.strokeStyle = `rgba(0, 255, 255, ${1 - dist/120})`;
                    ctx.lineWidth = Math.random() * 2;
                    ctx.moveTo(ballPos.x + (Math.random()-0.5)*20, ballPos.y + (Math.random()-0.5)*20);
                    // Garis zigzag ke bintang
                    let midX = (ballPos.x + star.x) / 2 + (Math.random() - 0.5) * 30;
                    let midY = (ballPos.y + star.y) / 2 + (Math.random() - 0.5) * 30;
                    ctx.lineTo(midX, midY);
                    ctx.lineTo(star.x, star.y);
                    ctx.stroke();
                }
            });

            // MENGGAMBAR OVAL LISTRIK
            const jitterX = (Math.random() - 0.5) * 10;
            const jitterY = (Math.random() - 0.5) * 10;

            ctx.save();
            ctx.translate(ballPos.x + jitterX, ballPos.y + jitterY);
            
            // Rotasi oval dikit biar dinamis
            ctx.rotate(Math.atan2(mouse.y - ballPos.y, mouse.x - ballPos.x));

            // Layer Glow Luar (Cyan)
            ctx.shadowBlur = 40;
            ctx.shadowColor = '#00ffff';
            ctx.fillStyle = 'rgba(0, 255, 255, 0.2)';
            ctx.beginPath();
            ctx.ellipse(0, 0, 45, 25, 0, 0, Math.PI * 2);
            ctx.fill();

            // Layer Inti (Putih Terang)
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#fff';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.beginPath();
            ctx.ellipse(0, 0, 35, 18, 0, 0, Math.PI * 2);
            ctx.fill();

            // Percikan Listrik Internal (Jittery lines di dalam oval)
            for(let i=0; i<5; i++) {
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo((Math.random()-0.5)*40, (Math.random()-0.5)*20);
                ctx.lineTo((Math.random()-0.5)*40, (Math.random()-0.5)*20);
                ctx.stroke();
            }

            ctx.restore();
        }

        function loop() {
            draw();
            requestAnimationFrame(loop);
        }

        init();
        loop();
    </script>
</body>
</html>
