<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electric Venom Starfield</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let mouse = { x: 0, y: 0 };
        const stars = [];
        const numStars = 600; 

        const segments = [];
        const numSegments = 25; // Lebih pendek agar terasa seperti aliran listrik cepat
        
        function init() {
            resize();
            for (let i = 0; i < numStars; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 2,
                    brightness: Math.random()
                });
            }
            for (let i = 0; i < numSegments; i++) {
                segments.push({ x: width / 2, y: height / 2 });
            }
        }

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        function update() {
            segments[0].x += (mouse.x - segments[0].x) * 0.25;
            segments[0].y += (mouse.y - segments[0].y) * 0.25;

            for (let i = 1; i < numSegments; i++) {
                const seg = segments[i];
                const prev = segments[i - 1];
                // Efek Jitter (Getaran Listrik)
                const jitterX = (Math.random() - 0.5) * 15;
                const jitterY = (Math.random() - 0.5) * 15;
                
                seg.x += (prev.x - seg.x) * 0.5 + jitterX;
                seg.y += (prev.y - seg.y) * 0.5 + jitterY;
            }
        }

        function draw() {
            // Background dengan sedikit trail (efek bayangan)
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.fillRect(0, 0, width, height);

            // Gambar Bintang
            stars.forEach(star => {
                ctx.fillStyle = `rgba(255, 255, 255, ${star.brightness})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // Efek Loncatan Listrik ke Bintang (Banyakin & Terangin)
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#00ffff';
            ctx.strokeStyle = 'rgba(0, 255, 255, 0.8)';
            ctx.lineWidth = 1.5;

            segments.forEach((seg) => {
                stars.forEach(star => {
                    const dx = seg.x - star.x;
                    const dy = seg.y - star.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < 70) { // Jangkauan sambaran listrik
                        ctx.beginPath();
                        ctx.moveTo(seg.x, seg.y);
                        // Garis zigzag patah-patah khas listrik
                        ctx.lineTo(star.x + (Math.random()-0.5)*10, star.y + (Math.random()-0.5)*10);
                        ctx.stroke();
                    }
                });
            });

            // Gambar Inti Listrik Utama
            ctx.beginPath();
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#fff'; // Inti putih agar silau
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#00ffff';
            
            ctx.moveTo(segments[0].x, segments[0].y);
            for (let i = 1; i < numSegments; i++) {
                ctx.lineTo(segments[i].x, segments[i].y);
            }
            ctx.stroke();

            // Tambahan lapisan biru luar
            ctx.lineWidth = 8;
            ctx.strokeStyle = 'rgba(0, 255, 255, 0.3)';
            ctx.stroke();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        init();
        loop();
    </script>
</body>
</html>
